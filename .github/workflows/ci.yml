name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Verify toolchain runtimes
        env:
          EXPECTED_NODE: ${{ matrix.node-version }}
        run: |
          pnpm --version
          node -p process.versions.node
          pnpm exec node -p process.versions.node
          node -e "require('node:assert/strict').equal(process.versions.node.split('.')[0], process.env.EXPECTED_NODE.split('.')[0])"
          pnpm exec node -e "require('node:assert/strict').equal(process.versions.node.split('.')[0], process.env.EXPECTED_NODE.split('.')[0])"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test --run

      - name: Test documentation
        run: pnpm test:docs

      - name: Check generated documentation
        run: git diff --exit-code -- apps/www/public apps/www/src/generated skills/calendar

      - name: Verify packed packages
        run: pnpm verify:packages

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish @gobrand/calendar-core to npm
        run: pnpm --filter @gobrand/calendar-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @gobrand/react-calendar to npm
        run: pnpm --filter @gobrand/react-calendar publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
